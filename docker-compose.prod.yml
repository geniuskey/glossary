# 사내망 온프레미스 프로덕션 스택.
#
# R128: `${POSTGRES_PASSWORD}`를 그냥 쓰면 변수가 없을 때 compose가 빈 문자열로
# 치환하고 경고만 낸다 — .env를 안 만들었거나 오타가 나도 스택이 그대로 뜬다.
# `:?`를 붙여 없으면 기동 자체가 실패하게 한다.
#
# 주의: 이 파일은 개발용 docker-compose.yml과 같은 볼륨 이름(grossary_pgdata)을
# 쓴다(전역 제약: 디렉터리명 파생 금지). 프로덕션은 자기 호스트에서 도는 것을
# 전제한 것이라, **개발 머신에서 이 파일로 `up`하지 마라** — 개발 데이터 볼륨에
# 그대로 붙는다. docs/operations.md에 같은 경고가 있다.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grossary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요합니다. .env를 만들고 값을 채워라}
      POSTGRES_DB: grossary
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grossary"]
      interval: 5s
      retries: 10
    # 포트를 호스트로 내보내지 않는다. app 컨테이너만 내부 네트워크로 붙으면 된다.
    # DB에 직접 붙어야 하면 `docker compose exec postgres psql`을 쓴다.

  migrator:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://grossary:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요합니다}@postgres:5432/grossary
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://grossary:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요합니다}@postgres:5432/grossary
      NODE_ENV: production
    ports:
      # R130: 평문 HTTP다. 로그인 비밀번호와 세션 쿠키가 그대로 흐른다.
      # 리버스 프록시로 TLS를 씌우는 것을 권장한다 — docs/operations.md 참조.
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata:
    name: grossary_pgdata
