name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_TEST: postgres://glossary:glossary@localhost:5434/glossary_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Migrate databases
        run: |
          DATABASE_URL=postgres://glossary:glossary@localhost:5434/glossary pnpm --filter @glossary/db db:migrate
          pnpm --filter @glossary/db db:migrate:test

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm docs:build

      - name: Install Chromium for browser smoke test
        run: pnpm --filter @glossary/web exec playwright install --with-deps chromium

      - name: Browser user journey
        run: pnpm --filter @glossary/web test:e2e

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
