# Docker Hub에서 미리 빌드된 이미지를 pull해 사내에 배포하는 스택.
# 소스 코드나 scripts/init-db.sql이 없어도 동작하도록 pg_trgm·vector 초기화를 별도
# 일회성 컨테이너가 맡는다. 앱·migrator·RAG worker는 같은 저장소의 서로 다른 태그다.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: glossary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: glossary
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glossary -d glossary"]
      interval: 5s
      retries: 10

  database-init:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command:
      - psql
      - -h
      - postgres
      - -U
      - glossary
      - -d
      - glossary
      - -v
      - ON_ERROR_STOP=1
      - -c
      - CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS vector;
    depends_on:
      postgres:
        condition: service_healthy

  migrator:
    image: ${GLOSSARY_MIGRATOR_IMAGE:?GLOSSARY_MIGRATOR_IMAGE is required}
    restart: "no"
    environment:
      DATABASE_URL: postgres://glossary:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/glossary
    depends_on:
      database-init:
        condition: service_completed_successfully

  app:
    image: ${GLOSSARY_IMAGE:?GLOSSARY_IMAGE is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://glossary:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/glossary
      NODE_ENV: production
      GLOSSARY_EMBED_ANCESTORS: ${GLOSSARY_EMBED_ANCESTORS:-}
      GLOSSARY_CONFLUENCE_MEETINGS_URL: ${GLOSSARY_CONFLUENCE_MEETINGS_URL:-}
      GLOSSARY_ENCRYPTION_KEY: ${GLOSSARY_ENCRYPTION_KEY:-}
      GLOSSARY_ALLOWED_ORIGINS: ${GLOSSARY_ALLOWED_ORIGINS:?GLOSSARY_ALLOWED_ORIGINS is required}
      GLOSSARY_BASE_URL: ${GLOSSARY_BASE_URL:-}
      GLOSSARY_AI_ALLOWED_PRIVATE_HOSTS: ${GLOSSARY_AI_ALLOWED_PRIVATE_HOSTS:-}
      GLOSSARY_TRUST_PROXY_HEADERS: ${GLOSSARY_TRUST_PROXY_HEADERS:-false}
      OAUTH2_PROXY_ENABLED: ${OAUTH2_PROXY_ENABLED:-false}
      # 0.1.6 이전 배포의 무중단 설정 전환용. 새 배포에서는 사용하지 않는다.
      AUTH_MODE: ${AUTH_MODE:-}
      # 최초 부팅/기존 설치의 초기값. 저장 후에는 관리자 패널의 DB 설정이 우선한다.
      PASSWORD_LOGIN_ENABLED: ${PASSWORD_LOGIN_ENABLED:-true}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      SSO_LOGIN_URL: ${SSO_LOGIN_URL:-}
      SSO_TRUST_PROXY_HEADERS: ${SSO_TRUST_PROXY_HEADERS:-}
      OAUTH2_PROXY_PREFERRED_USERNAME_HEADER: ${OAUTH2_PROXY_PREFERRED_USERNAME_HEADER:-X-Forwarded-Preferred-Username}
      OAUTH2_PROXY_EMAIL_HEADER: ${OAUTH2_PROXY_EMAIL_HEADER:-X-Forwarded-Email}
      OAUTH2_PROXY_GROUPS_HEADER: ${OAUTH2_PROXY_GROUPS_HEADER:-X-Forwarded-Groups}
      OAUTH2_SUBJECT_FIELD: ${OAUTH2_SUBJECT_FIELD:-}
    ports:
      - "127.0.0.1:${GLOSSARY_PORT:-3000}:3000"
    # restart: unless-stopped는 프로세스가 죽을 때만 반응한다. 프로세스는 살아 있는데
    # 요청에 응답하지 못하거나 DB에 못 붙는 상태는 healthcheck 없이는 `Up`으로만 보인다.
    # runner는 alpine이라 busybox wget이 있다. --spider(HEAD)가 아니라 GET으로 받는다 —
    # health 라우트는 GET만 처리한다. 컨테이너 안 포트는 GLOSSARY_PORT와 무관하게 3000이다.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  rag-worker:
    image: ${GLOSSARY_WORKER_IMAGE:?GLOSSARY_WORKER_IMAGE is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://glossary:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/glossary
      NODE_ENV: production
      GLOSSARY_ENCRYPTION_KEY: ${GLOSSARY_ENCRYPTION_KEY:-}
      GLOSSARY_AI_ALLOWED_PRIVATE_HOSTS: ${GLOSSARY_AI_ALLOWED_PRIVATE_HOSTS:-}
      GLOSSARY_RAG_WORKER_BATCH: ${GLOSSARY_RAG_WORKER_BATCH:-8}
      GLOSSARY_RAG_WORKER_IDLE_MS: ${GLOSSARY_RAG_WORKER_IDLE_MS:-2000}
      GLOSSARY_RAG_WORKER_BUSY_MS: ${GLOSSARY_RAG_WORKER_BUSY_MS:-100}
      GLOSSARY_AI_RUN_RETENTION_DAYS: ${GLOSSARY_AI_RUN_RETENTION_DAYS:-180}
      GLOSSARY_AUDIT_RETENTION_DAYS: ${GLOSSARY_AUDIT_RETENTION_DAYS:-365}
      GLOSSARY_ATTACHMENT_RETENTION_DAYS: ${GLOSSARY_ATTACHMENT_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata:
    name: glossary_hub_pgdata
